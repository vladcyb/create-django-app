[project]
name = "create-django-app"
version = "0.1.0"
description = "Bootstrap a Django project with uv lockfiles from Docker."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
create-django-app = "create_django_app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
